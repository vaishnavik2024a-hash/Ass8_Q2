<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #222;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>VIT Vellore</h1>
    <h2>Student Feedback Web Application</h2>
</header>

<div class="container">

    <h2>Course Feedback Form</h2>

    <label>Course Name</label>
    <input type="text" placeholder="Enter course name">

    <label>Faculty Name</label>
    <input type="text" placeholder="Enter faculty name">

    <label>Student Name</label>
    <input type="text" placeholder="Enter student name">

    <label>Register Number</label>
    <input type="text" placeholder="Enter register number">

    <label>Department</label>
    <input type="text" placeholder="Enter department">

    <label>Rating</label>
    <select>
        <option>5 - Excellent</option>
        <option>4 - Very Good</option>
        <option>3 - Good</option>
        <option>2 - Average</option>
        <option>1 - Poor</option>
    </select>

    <label>Feedback / Comments</label>
    <textarea rows="5" placeholder="Enter your feedback"></textarea>

    <button>Submit Feedback</button>

</div>

</body>
</html>
